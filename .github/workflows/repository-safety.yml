name: Repository safety

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-public-repository:
    name: Verify public repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject source, binaries, private data, and credentials
        shell: python
        run: |
          import json
          import pathlib
          import re
          import subprocess

          current_files = [
              pathlib.Path(item)
              for item in subprocess.check_output(
                  ["git", "ls-files", "-z"], text=False
              ).decode("utf-8").split("\0")
              if item
          ]
          forbidden_suffixes = {
              ".exe", ".msi", ".zip", ".7z", ".rar", ".blockmap",
              ".sqlite", ".db", ".pem", ".key", ".pfx", ".p12",
              ".dll", ".node", ".pak", ".bin",
              ".png", ".jpg", ".jpeg", ".webp", ".gif", ".mp4", ".mov",
          }
          forbidden_parts = {
              "src", "tests", "scripts", "build", "node_modules",
              "user data", "user-data", "network", "profiles", "profile",
              "runtime-data", "generated-images", "media", "logs",
              "browser", "win-unpacked", "dist", "output", "artifacts", "release",
          }
          forbidden_names = {
              "cookies", "login data", "local state",
              "ai-settings.json", "account-registry.json", "media-index.json",
              "publish-jobs.json", "jobs.json", ".env",
          }
          credential_patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(rb"sk-(?:proj-)?[A-Za-z0-9_-]{20,}"),
              re.compile(rb"sk-ant-[A-Za-z0-9_-]{20,}"),
              re.compile(rb"AKIA[A-Z0-9]{16}"),
              re.compile(
                  rb"(?i)(?:api[_-]?key|access[_-]?token|client[_-]?secret)"
                  rb"\s*[:=]\s*[\"'][^\"'\r\n]{12,}[\"']"
              ),
              re.compile(rb"(?i)authorization\s*:\s*bearer\s+[A-Za-z0-9._~-]{16,}"),
          ]

          def unsafe_path(path):
              lowered_parts = {part.lower() for part in path.parts}
              return (
                  path.name.lower() in forbidden_names
                  or bool(lowered_parts & forbidden_parts)
                  or path.suffix.lower() in forbidden_suffixes
              )

          problems = []
          for path in current_files:
              if unsafe_path(path):
                  problems.append(f"forbidden tracked file: {path}")
                  continue
              data = path.read_bytes()
              if len(data) > 2 * 1024 * 1024:
                  problems.append(f"tracked file exceeds 2 MiB: {path}")
              if any(pattern.search(data) for pattern in credential_patterns):
                  problems.append(f"possible credential in: {path}")

          # Inspect every reachable Git blob so a deleted secret cannot remain
          # available in public history.
          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True
          ).splitlines()
          checked_blobs = set()
          for item in objects:
              object_id, _, raw_path = item.partition(" ")
              if not raw_path:
                  continue
              path = pathlib.PurePosixPath(raw_path)
              if unsafe_path(path):
                  problems.append(f"forbidden file in Git history: {path}")
                  continue
              object_type = subprocess.check_output(
                  ["git", "cat-file", "-t", object_id], text=True
              ).strip()
              if object_type != "blob":
                  continue
              if object_id in checked_blobs:
                  continue
              checked_blobs.add(object_id)
              data = subprocess.check_output(["git", "cat-file", "blob", object_id])
              if len(data) > 2 * 1024 * 1024:
                  problems.append(f"Git history blob exceeds 2 MiB: {path}")
              if any(pattern.search(data) for pattern in credential_patterns):
                  problems.append(f"possible credential in Git history: {path}")

          manifest = pathlib.Path("release-manifest.json")
          if manifest.exists():
              payload = json.loads(manifest.read_text(encoding="utf-8"))
              required = {
                  "name", "version", "platform", "archive", "sha256",
                  "browser", "privateDataIncluded",
              }
              missing = sorted(required - payload.keys())
              if missing:
                  problems.append(
                      f"release manifest missing: {', '.join(missing)}"
                  )
              if payload.get("name") != "XHS-FB":
                  problems.append("release manifest name must be XHS-FB")
              if str(payload.get("platform", "")).lower() not in {
                  "windows 10/11 x64", "windows-x64"
              }:
                  problems.append("release manifest platform must be Windows x64")
              if payload.get("privateDataIncluded") is not False:
                  problems.append(
                      "release manifest must declare privateDataIncluded=false"
                  )
              version = str(payload.get("version", ""))
              archive = str(payload.get("archive", ""))
              sha256 = str(payload.get("sha256", ""))
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  problems.append(
                      "release manifest version must use major.minor.patch"
                  )
              if archive != f"XHS-FB-{version}-Windows-x64.zip":
                  problems.append("release manifest archive name is invalid")
              if not re.fullmatch(r"[0-9a-f]{64}", sha256):
                  problems.append(
                      "release manifest sha256 must be 64 lowercase hex characters"
                  )

              browser = payload.get("browser")
              if not isinstance(browser, dict):
                  problems.append("release manifest browser must be an object")
              else:
                  expected_browser = {
                      "family": "ungoogled-chromium-windows",
                      "version": "151.0.7922.71",
                      "architecture": "windows-x64",
                      "sourceUrl": (
                          "https://github.com/ungoogled-software/"
                          "ungoogled-chromium-windows/releases/download/"
                          "151.0.7922.71-1.1/"
                          "ungoogled-chromium_151.0.7922.71-1.1_windows_x64.zip"
                      ),
                      "sha256": (
                          "f49303e9b61aab632e399a12c36b72b184158e965b6d6373105f19f2e884fd6e"
                      ),
                  }
                  for field, expected in expected_browser.items():
                      if browser.get(field) != expected:
                          problems.append(
                              f"release manifest browser.{field} is invalid"
                          )
          else:
              print(
                  "release-manifest.json is not tracked yet; "
                  "the published Release must still include it as an asset."
              )

          if problems:
              raise SystemExit("\n".join(sorted(set(problems))))
          print(
              f"Verified {len(current_files)} current files and "
              f"{len(checked_blobs)} reachable Git blobs."
          )

  verify-release-assets:
    name: Verify published Release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify-public-repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the actual published assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $assetDir = Join-Path $env:RUNNER_TEMP "xhs-fb-release-assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          $downloaded = $false
          foreach ($attempt in 1..5) {
            Get-ChildItem -LiteralPath $assetDir -File -ErrorAction SilentlyContinue |
              Remove-Item -Force
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assetDir --pattern "XHS-FB-*-Windows-x64.zip" --pattern "XHS-FB-*-Windows-x64.zip.sha256" --pattern "release-manifest.json" --clobber
            $archiveCount = @(Get-ChildItem -LiteralPath $assetDir -File |
              Where-Object { $_.Name -match '^XHS-FB-\d+\.\d+\.\d+-Windows-x64\.zip$' }).Count
            $checksumCount = @(Get-ChildItem -LiteralPath $assetDir -File |
              Where-Object { $_.Name -match '^XHS-FB-\d+\.\d+\.\d+-Windows-x64\.zip\.sha256$' }).Count
            $manifestCount = @(Get-ChildItem -LiteralPath $assetDir -File |
              Where-Object { $_.Name -eq 'release-manifest.json' }).Count
            if ($LASTEXITCODE -eq 0 -and $archiveCount -eq 1 -and
                $checksumCount -eq 1 -and $manifestCount -eq 1) {
              $downloaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }
          if (-not $downloaded) {
            throw "Unable to download all required Release assets."
          }
          "ASSET_DIR=$assetDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify archive, checksums, manifest, and portable layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem -LiteralPath $env:ASSET_DIR -File |
            Where-Object { $_.Name -match '^XHS-FB-\d+\.\d+\.\d+-Windows-x64\.zip$' })
          $checksums = @(Get-ChildItem -LiteralPath $env:ASSET_DIR -File |
            Where-Object { $_.Name -match '^XHS-FB-\d+\.\d+\.\d+-Windows-x64\.zip\.sha256$' })
          $manifests = @(Get-ChildItem -LiteralPath $env:ASSET_DIR -File |
            Where-Object { $_.Name -eq 'release-manifest.json' })

          if ($archives.Count -ne 1) {
            throw "Expected exactly one XHS-FB Windows x64 ZIP."
          }
          if ($checksums.Count -ne 1) {
            throw "Expected exactly one matching .sha256 file."
          }
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one release-manifest.json."
          }

          $archive = $archives[0]
          $checksumFile = $checksums[0]
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw |
            ConvertFrom-Json

          foreach ($field in @(
            "name", "version", "platform", "archive", "sha256",
            "browser", "privateDataIncluded"
          )) {
            if ($null -eq $manifest.PSObject.Properties[$field]) {
              throw "Release manifest is missing $field."
            }
          }
          if ([string]$manifest.name -ne "XHS-FB") {
            throw "Release manifest name must be XHS-FB."
          }
          if ([string]$manifest.platform -notin @(
            "Windows 10/11 x64", "windows-x64"
          )) {
            throw "Release manifest platform must be Windows x64."
          }
          if ([string]$manifest.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release manifest version is invalid."
          }
          if ($env:RELEASE_TAG -ne "v$($manifest.version)") {
            throw "Release tag does not match manifest version."
          }
          $expectedArchive = "XHS-FB-$($manifest.version)-Windows-x64.zip"
          if ($archive.Name -ne $expectedArchive -or
              [string]$manifest.archive -ne $expectedArchive) {
            throw "Archive name does not match the release manifest."
          }
          if ($checksumFile.Name -ne "$expectedArchive.sha256") {
            throw "Checksum asset name does not match the archive."
          }
          if (($manifest.privateDataIncluded -isnot [bool]) -or
              $manifest.privateDataIncluded) {
            throw "Release manifest must declare privateDataIncluded=false."
          }

          $actualHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).
            Hash.ToLowerInvariant()
          $manifestHash = ([string]$manifest.sha256).ToLowerInvariant()
          $checksumText = Get-Content -LiteralPath $checksumFile.FullName -Raw
          $checksumMatch = [regex]::Match(
            $checksumText,
            '(?i)(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])'
          )
          if (-not $checksumMatch.Success) {
            throw "Checksum asset does not contain a SHA-256 value."
          }
          $checksumHash = $checksumMatch.Value.ToLowerInvariant()
          if ($actualHash -ne $manifestHash -or $actualHash -ne $checksumHash) {
            throw "Published ZIP SHA-256 does not match all declared values."
          }

          $browser = $manifest.browser
          $expectedBrowser = @{
            family = "ungoogled-chromium-windows"
            version = "151.0.7922.71"
            architecture = "windows-x64"
            sourceUrl = "https://github.com/ungoogled-software/ungoogled-chromium-windows/releases/download/151.0.7922.71-1.1/ungoogled-chromium_151.0.7922.71-1.1_windows_x64.zip"
            sha256 = "f49303e9b61aab632e399a12c36b72b184158e965b6d6373105f19f2e884fd6e"
          }
          foreach ($field in $expectedBrowser.Keys) {
            if ([string]$browser.$field -ne $expectedBrowser[$field]) {
              throw "Release manifest browser.$field is invalid."
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object {
              $_.FullName.Replace("\", "/")
            })
            if (-not ($entries | Where-Object {
              $_ -match '(^|/)XHS-FB\.exe$'
            })) {
              throw "Published ZIP does not contain XHS-FB.exe."
            }
            if (-not ($entries | Where-Object {
              $_ -match '(^|/)resources/browser/chrome\.exe$'
            })) {
              throw "Published ZIP does not contain the bundled browser."
            }
            $privateEntryPattern = (
              '(^|/)(User Data|profiles?|runtime-data|generated-images|logs|' +
              'Cookies|Login Data|Local State|ai-settings\.json|' +
              'account-registry\.json|media-index\.json|' +
              '.*\.sqlite(?:-.*)?|.*\.db(?:-.*)?)($|/)'
            )
            $privateEntries = @($entries | Where-Object {
              $_ -match $privateEntryPattern
            })
            if ($privateEntries.Count -gt 0) {
              throw "Published ZIP contains a private-data path: $($privateEntries[0])"
            }
          } finally {
            $zip.Dispose()
          }

          Write-Host "Verified published asset: $($archive.Name)"
          Write-Host "SHA-256: $actualHash"
